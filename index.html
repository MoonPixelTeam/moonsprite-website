<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a0d" />
    <!-- 站点图标：方形月亮标识。优先 SVG（矢量、任意尺寸清晰），PNG 作为回退。 -->
    <link rel="icon" href="/assets/moonsprite-logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="MoonSprite 是面向 Windows 的原创源码可见像素画工作台。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MoonSprite - Windows 像素画工作台" />
    <meta property="og:description" content="绘制、制作动画并管理完整的像素创作流程。" />
    <meta property="og:image" content="/assets/product/workspace-v3-2560.webp" />
    <title>MoonSprite - Windows 像素画工作台</title>
    <script>
      ;(function () {
        var stored = null
        try { stored = localStorage.getItem('moonsprite-site-theme') } catch (error) {}
        var theme = stored === 'light' || stored === 'dark' ? stored : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
